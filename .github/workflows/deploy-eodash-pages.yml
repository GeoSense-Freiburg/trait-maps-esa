name: Deploy EO Dashboard to GitHub Pages

on:
  push:
    branches: [eo-dashboard]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eodash/viewer/package-lock.json
      - name: Determine Pages base path
        shell: bash
        env:
          CONFIGURED_BASE: ${{ vars.EODASH_BASE_PATH }}
        run: |
          if [[ -n "$CONFIGURED_BASE" ]]; then
            base="$CONFIGURED_BASE"
          elif [[ "${GITHUB_REPOSITORY#*/}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base="/"
          else
            base="/${GITHUB_REPOSITORY#*/}/"
          fi
          printf 'EODASH_BASE_PATH=%s\n' "$base" >> "$GITHUB_ENV"
      - name: Install viewer dependencies
        run: npm ci
        working-directory: eodash/viewer
      - name: Build viewer
        run: npm run build
        working-directory: eodash/viewer
      - name: Assemble static deployment
        shell: bash
        run: |
          mkdir -p site/eodash
          cp -a eodash/viewer/.eodash/dist/. site/
          cp -a stac_catalogs site/stac_catalogs
          cp -a eodash/config site/eodash/config
          cp -a eodash/reference site/eodash/reference
          cp -a eodash/styles site/eodash/styles
          cp site/index.html site/404.html
          if find site -type f \( -iname '*.tif' -o -iname '*.tiff' \) | grep -q .; then
            printf 'TIFF files must not be included in the Pages artifact.\n' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
